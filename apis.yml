- aid: razorpay:webhooks
  name: Razorpay Webhooks
  description: >-
    Event-driven webhook surface that POSTs JSON payloads to a merchant-configured HTTPS endpoint when
    subscribed events occur across payments, orders, refunds, subscriptions, invoices, settlements, Smart
    Collect virtual accounts, payment links, Route transfers, disputes, and payment downtime advisories.
    Each delivery is signed with an HMAC-SHA256 hex digest of the raw request body using the merchant's
    webhook secret, transmitted via the X-Razorpay-Signature header.
  humanURL: https://razorpay.com/docs/webhooks/
  tags:
